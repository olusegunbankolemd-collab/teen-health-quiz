<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Check Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: one centered question card at a time on the talk's soft-blue ground, coral True / sky False buttons, score screen at the end */
:root{
  --bg:#E3EDFD; --card:#FFFFFF; --ink:#3D4470; --muted:#6A7099;
  --coral:#F08484; --coral-ink:#FFFFFF; --sky:#B7E0F0; --peri:#8EA3D6;
  --good:#2E8B6A; --good-bg:#E2F5EC; --bad:#C2484B; --bad-bg:#FDE8E8;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Quicksand","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B2040; --card:#262C55; --ink:#E7ECFF; --muted:#AEB5DA;
  --coral:#F08484; --coral-ink:#1B2040; --sky:#3E6F86; --peri:#8EA3D6;
  --good:#7FD8B2; --good-bg:#1F3D39; --bad:#FF9EA0; --bad-bg:#47273A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B2040; --card:#262C55; --ink:#E7ECFF; --muted:#AEB5DA;
  --coral:#F08484; --coral-ink:#1B2040; --sky:#3E6F86; --peri:#8EA3D6;
  --good:#7FD8B2; --good-bg:#1F3D39; --bad:#FF9EA0; --bad-bg:#47273A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{text-align:center;display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,2.8rem);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.5px}
.sub{color:var(--muted);font-weight:600;margin:0}
.progress{display:flex;gap:6px;justify-content:center}
.dot{width:22px;height:8px;border-radius:4px;background:var(--sky)}
.dot.done{background:var(--peri)}.dot.now{background:var(--coral)}
.card{background:var(--card);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 6px 0 rgba(61,68,112,.08)}
.qnum{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--muted)}
.q{font-size:1.3rem;font-weight:700;margin:0;text-wrap:balance}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 18px;font-family:var(--display);font-size:1.35rem;letter-spacing:.5px}
button:focus-visible{outline:3px solid var(--peri);outline-offset:3px}
.t{background:var(--coral);color:var(--coral-ink)}
.f{background:var(--sky);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button.picked{opacity:1;box-shadow:0 0 0 3px var(--ink)}
.fb{border-radius:16px;padding:14px 16px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)}.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;letter-spacing:.3px}
.fb span{color:var(--ink);font-weight:500}
.next{background:var(--ink);color:var(--bg);justify-self:end;font-size:1.15rem;padding:12px 26px}
.score{font-family:var(--display);font-size:4rem;line-height:1;margin:0;text-align:center}
.msg{text-align:center;font-weight:600;margin:0}
.help{background:var(--bg);border-radius:16px;padding:14px 16px;font-weight:600;font-size:.95rem}
.help strong{color:var(--coral)}
footer{text-align:center;color:var(--muted);font-size:.85rem;font-weight:600}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px)}to{transform:none}}}
/* Celebrations: confetti canvas over the page, "Correct!" burst, winner trophy */
.card{position:relative}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.burst{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;
  font-family:var(--display);font-size:clamp(2.6rem,12vw,4rem);line-height:1;color:var(--good);
  background:var(--good-bg);padding:14px 28px;border-radius:999px;box-shadow:0 6px 0 rgba(46,139,106,.25);white-space:nowrap;opacity:0}
.burst.go{animation:burst 1.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}
  30%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
  75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}
.fb.ok b{display:flex;align-items:center;gap:8px}
.check{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--good);color:var(--good-bg);font-size:.8em;flex:none}
.trophy{display:flex;flex-direction:column;align-items:center;gap:6px}
.trophy svg{width:min(190px,55vw);height:auto;overflow:visible}
.winner{font-family:var(--display);font-size:clamp(2rem,9vw,2.8rem);line-height:1;margin:0;color:var(--coral);text-align:center;letter-spacing:.5px}
.ribbon{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){
  .trophy svg{animation:rise .9s cubic-bezier(.2,1.5,.4,1) both, bob 2.6s ease-in-out .9s infinite}
  .winner{animation:rise .9s cubic-bezier(.2,1.5,.4,1) .15s both}
  .shine{animation:shine 2.2s ease-in-out .8s infinite}
  .spark{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .spark.s2{animation-delay:.5s}.spark.s3{animation-delay:1s}
  @keyframes rise{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-2deg)}}
  @keyframes shine{0%,100%{opacity:0}45%{opacity:.85}}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
}
@media (prefers-reduced-motion:reduce){.burst.go{opacity:1;animation:fadeout 1.4s steps(1,end) forwards}@keyframes fadeout{to{opacity:0}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Health Check Quiz</h1>
    <p class="sub">Mental health &amp; hygiene · 10 true or false questions</p>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main id="stage" aria-live="polite"></main>
  <footer>Olusegun Bankole MD · Taking Charge of Your Health</footer>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const Q=[
 {q:"Teenagers need about 8 to 10 hours of sleep each night.",a:true,e:"Your brain and body do a lot of growing and repairing while you sleep. Most teens get less than they need."},
 {q:"Feeling sad, stressed or worried sometimes means something is seriously wrong with you.",a:false,e:"Everyone has hard days. If the feelings last for weeks or get in the way of school, sleep or friends, talk to someone you trust."},
 {q:"Asking for help with your feelings is a sign of weakness.",a:false,e:"Reaching out to a parent, counselor, coach or doctor takes strength. It is one of the most powerful self-care steps."},
 {q:"Using your phone right before bed can make it harder to fall asleep.",a:true,e:"Screen light and scrolling keep your brain alert. Try screens off about 30 minutes before bed."},
 {q:"Social media usually shows a realistic picture of people's everyday lives.",a:false,e:"Posts are filtered, edited and chosen. Social media is not real life, so don't measure your worth against it."},
 {q:"Brushing your teeth once a day is enough to keep them healthy.",a:false,e:"Brush twice a day, floss daily, and see the dentist every 6 months."},
 {q:"Acne happens because a person is dirty.",a:false,e:"Puberty hormones make skin oilier, so acne is normal. Wash gently twice a day and don't pick or squeeze pimples."},
 {q:"Regular physical activity can lower stress and improve your mood.",a:true,e:"Exercise releases feel-good chemicals. Aim for 60 minutes of activity most days."},
 {q:"Washing your hands with soap for at least 20 seconds helps stop germs from spreading.",a:true,e:"Wash before eating, after the bathroom and after sports. It's one of the simplest ways to avoid getting sick."},
 {q:"In the U.S., you can call or text 988 any time if you or a friend are in crisis.",a:true,e:"988 is the Suicide & Crisis Lifeline: free, confidential, 24/7, by call, text or chat."}
];
let i=0,score=0,answered=false;
const stage=document.getElementById('stage'),prog=document.getElementById('progress');
const WIN=Math.ceil(Q.length*0.8); // 80% = 8 of 10

/* Confetti: small canvas particle system, colors from the talk's palette */
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
const COLORS=['#F08484','#8EA3D6','#B7E0F0','#3D4470','#FFD166','#7FD8B2'];
let parts=[],raf=0;
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeCanvas(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',sizeCanvas);sizeCanvas();
function confetti(n,ox,oy,spread){
  if(calm())return;
  for(let k=0;k<n;k++){
    const a=-Math.PI/2+(Math.random()-.5)*spread, s=6+Math.random()*9;
    parts.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.22+Math.random()*.12,
      w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,
      c:COLORS[k%COLORS.length],round:Math.random()<.3,life:0});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);
  for(const p of parts){
    p.life++;p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    cx.globalAlpha=p.life>200?Math.max(0,(260-p.life)/60):1;
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2.4,0,6.28);cx.fill()}
    else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.7))+1);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
}
function fromEl(el){const b=el.getBoundingClientRect();return[b.left+b.width/2,b.top+b.height/2]}

const TROPHY=`<svg viewBox="0 0 200 210" role="img" aria-label="Gold winner trophy">
  <defs>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#F6B93B"/><stop offset=".5" stop-color="#FFE08A"/><stop offset="1" stop-color="#E89A1C"/></linearGradient>
    <linearGradient id="gold2" x1="0" x2="1"><stop offset="0" stop-color="#D98A12"/><stop offset="1" stop-color="#F6B93B"/></linearGradient>
  </defs>
  <path d="M52 40 C14 40 14 98 62 104" fill="none" stroke="url(#gold2)" stroke-width="12" stroke-linecap="round"/>
  <path d="M148 40 C186 40 186 98 138 104" fill="none" stroke="url(#gold2)" stroke-width="12" stroke-linecap="round"/>
  <path d="M48 26 H152 V62 C152 98 128 122 100 122 C72 122 48 98 48 62 Z" fill="url(#gold)"/>
  <path class="shine" d="M66 36 C64 70 72 96 90 110" fill="none" stroke="#FFF7D6" stroke-width="7" stroke-linecap="round" opacity=".6"/>
  <rect x="90" y="120" width="20" height="26" rx="4" fill="url(#gold2)"/>
  <rect x="64" y="144" width="72" height="14" rx="5" fill="url(#gold)"/>
  <rect x="52" y="158" width="96" height="34" rx="8" fill="#3D4470"/>
  <text x="100" y="181" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="17" fill="#FFE08A" letter-spacing="1">WINNER</text>
  <path d="M100 48 l7 14 15 2 -11 10 3 15 -14 -7 -14 7 3 -15 -11 -10 15 -2z" fill="#FFF7D6"/>
  <path class="spark" d="M24 18 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#F08484"/>
  <path class="spark s2" d="M176 12 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#8EA3D6"/>
  <path class="spark s3" d="M182 130 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#FFD166"/>
</svg>`;
function dots(){prog.innerHTML=Q.map((_,k)=>`<span class="dot ${k<i?'done':k===i?'now':''}"></span>`).join('')}
function show(){
  answered=false;dots();
  const x=Q[i];
  stage.innerHTML=`<section class="card">
    <div class="qnum">Question ${i+1} of ${Q.length}</div>
    <p class="q">${x.q}</p>
    <div class="btns"><button class="t" id="btn-true">True</button><button class="f" id="btn-false">False</button></div>
    <div id="fbslot"></div></section>`;
  document.getElementById('btn-true').onclick=()=>pick(true);
  document.getElementById('btn-false').onclick=()=>pick(false);
}
function pick(v){
  if(answered)return;answered=true;
  const x=Q[i],ok=v===x.a;if(ok)score++;
  const bt=document.getElementById('btn-true'),bf=document.getElementById('btn-false');
  bt.disabled=bf.disabled=true;(v?bt:bf).classList.add('picked');
  document.getElementById('fbslot').outerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'<span class="check" aria-hidden="true">✓</span>Correct!':'Not quite.'} The answer is ${x.a?'True':'False'}.</b><span>${x.e}</span></div>
    <button class="next" id="btn-next">${i<Q.length-1?'Next question':'See my score'}</button>`;
  if(ok){
    const card=stage.querySelector('.card'),b=document.createElement('div');
    b.className='burst';b.setAttribute('aria-hidden','true');b.textContent='Correct!';
    card.appendChild(b);requestAnimationFrame(()=>b.classList.add('go'));
    setTimeout(()=>b.remove(),1500);
    const [ox,oy]=fromEl(v?bt:bf);confetti(90,ox,oy,2.2);
  }
  const n=document.getElementById('btn-next');n.onclick=()=>{i++;i<Q.length?show():done()};n.focus({preventScroll:true});
}
function done(){
  prog.innerHTML=Q.map(()=>'<span class="dot done"></span>').join('');
  const m=score>=9?"Health pro! You really know your stuff.":score>=7?"Great job! You're on the right track.":score>=5?"Good start. Check the answers you missed.":"Keep learning. Ask questions, that's how we grow.";
  const won=score>=WIN;
  stage.innerHTML=`<section class="card">
    ${won?`<div class="trophy">${TROPHY}<p class="winner">You’re a winner!</p><p class="ribbon">${Math.round(score/Q.length*100)}% correct · Health champion</p></div>`:''}
    <div class="qnum" style="text-align:center">Your score</div>
    <p class="score">${score} / ${Q.length}</p>
    <p class="msg">${won?m:m+` Get ${WIN} or more right to win the trophy!`}</p>
    <div class="help">Need to talk? Call or text <strong>988</strong> any time. NYC teens 13–17 can also get free online therapy through <strong>NYC Teenspace</strong> (nyc.gov/teenspace).</div>
    <button class="next" id="btn-again" style="justify-self:center">Try again</button>
    <a class="next" href="game/" style="text-align:center;text-decoration:none;background:var(--coral);color:var(--coral-ink)">Play the Level Up game</a></section>`;
  document.getElementById('btn-again').onclick=()=>{i=0;score=0;show()};
  if(won){
    const w=innerWidth;
    confetti(160,w*.15,innerHeight*.9,1.1);confetti(160,w*.85,innerHeight*.9,1.1);
    setTimeout(()=>{const t=stage.querySelector('.trophy svg');if(t){const [ox,oy]=fromEl(t);confetti(140,ox,oy,6.28)}},700);
    setTimeout(()=>{confetti(120,w*.5,innerHeight*.95,1.4)},1600);
  }
}
show();
</script>
</body>
</html>
